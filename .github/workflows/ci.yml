name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: CI only needs to check out the code.
permissions:
  contents: read

# A new push to the same branch/PR cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff (same version as pre-commit)
        run: pip install ruff==0.17.6
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Build data and model (needed by the API tests)
        run: python -m src.download_data && python -m src.features && python -m src.train
      - name: Run tests
        run: python -m pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t dengue-api .
